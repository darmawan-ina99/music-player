<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#1a1033,#0b0b14);color:#eee;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:20px}
h1{font-size:1.3rem;text-align:center;margin:10px 0 18px}
.now{background:#ffffff12;border-radius:18px;padding:20px;text-align:center}
.cover{width:120px;height:120px;margin:0 auto 12px;border-radius:50%;background:conic-gradient(#8b5cf6,#ec4899,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:3rem}
.cover.spin{animation:s 6s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#title{font-weight:600;font-size:1.1rem;min-height:1.4em}
input[type=range]{width:100%;accent-color:#a78bfa}
.t{display:flex;justify-content:space-between;font-size:.75rem;opacity:.7}
.ctl{display:flex;justify-content:center;gap:14px;margin:10px 0}
button{background:#ffffff1a;border:0;color:#fff;border-radius:50%;width:46px;height:46px;font-size:1.1rem;cursor:pointer}
button.main{background:#8b5cf6;width:56px;height:56px}button.on{background:#ec4899}
ul{list-style:none;padding:0;margin:16px 0}
li{padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;gap:10px}
li:hover{background:#ffffff10}li.act{background:#8b5cf630;color:#c4b5fd}
li span{opacity:.5;width:1.6em}
</style></head><body><div class="app">
<h1>🎵 Music Player</h1>
<div class="now"><div class="cover" id="cover">♪</div><div id="title">Pilih lagu</div>
<input type="range" id="seek" value="0" min="0" max="100" step="0.1">
<div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctl"><button id="shuf" title="Acak">🔀</button><button id="prev">⏮</button><button class="main" id="play">▶</button><button id="next">⏭</button><button id="rep" title="Ulang">🔁</button></div>
<input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
<ul id="list"></ul></div>
<audio id="a" preload="metadata"></audio>
<script>
fetch('songs.json').then(r=>r.json()).then(S=>{
const a=document.getElementById('a'),$=i=>document.getElementById(i);let i=-1,shuf=false,rep=false;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
S.forEach((n,k)=>{const l=document.createElement('li');l.innerHTML='<span>'+(k+1)+'</span>'+n;l.onclick=()=>load(k,true);$('list').appendChild(l)});
function load(k,p){i=k;a.src='songs/'+encodeURIComponent(S[k])+'.mp3';$('title').textContent=S[k];
[...$('list').children].forEach((e,x)=>e.classList.toggle('act',x==k));if(p)a.play()}
function nxt(d){if(!S.length)return;let k=shuf?Math.floor(Math.random()*S.length):(i+d+S.length)%S.length;load(k,true)}
$('play').onclick=()=>{if(i<0)load(0,true);else a.paused?a.play():a.pause()};
$('next').onclick=()=>nxt(1);$('prev').onclick=()=>nxt(-1);
$('shuf').onclick=e=>{shuf=!shuf;e.target.classList.toggle('on',shuf)};
$('rep').onclick=e=>{rep=!rep;e.target.classList.toggle('on',rep)};
a.onplay=()=>{$('play').textContent='⏸';$('cover').classList.add('spin')};
a.onpause=()=>{$('play').textContent='▶';$('cover').classList.remove('spin')};
a.onended=()=>rep?(a.currentTime=0,a.play()):nxt(1);
a.ontimeupdate=()=>{$('seek').value=a.duration?a.currentTime/a.duration*100:0;$('cur').textContent=fmt(a.currentTime);$('dur').textContent=fmt(a.duration)};
$('seek').oninput=e=>{if(a.duration)a.currentTime=e.target.value/100*a.duration};
$('vol').oninput=e=>a.volume=e.target.value;
});
</script></body></html>
