<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON AMP</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;color:#0ff;
background:radial-gradient(circle at 20% 20%,#2a0a4a 0,transparent 45%),radial-gradient(circle at 80% 80%,#0a2a4a 0,transparent 45%),#05030c}
.amp{width:100%;max-width:560px;margin:16px;border-radius:14px;padding:3px;
background:linear-gradient(135deg,#ff00cc,#00e5ff,#7CFF00,#ffe600,#ff00cc);background-size:300% 300%;animation:bd 8s linear infinite;
box-shadow:0 0 40px #ff00cc55,0 0 80px #00e5ff33}
@keyframes bd{to{background-position:300% 300%}}
.in{background:linear-gradient(180deg,#14102a,#0a0818);border-radius:12px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:.72rem;letter-spacing:.25em;
background:linear-gradient(90deg,#ff00cc,#7a00ff,#00e5ff);color:#fff;text-shadow:0 0 6px #000}
.disp{margin:12px;padding:10px;border-radius:8px;background:#02020a;border:1px solid #2b2b5a;box-shadow:inset 0 0 20px #000}
.row{display:flex;gap:10px;align-items:center}
.time{font-size:2.1rem;color:#7CFF00;text-shadow:0 0 10px #7CFF00,0 0 22px #7CFF00;min-width:104px;font-weight:bold}
.title{flex:1;overflow:hidden;white-space:nowrap;font-size:.9rem;color:#ffe600;text-shadow:0 0 8px #ffe600}
.title span{display:inline-block;padding-left:100%;animation:mq 12s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.meta{font-size:.62rem;opacity:.7;margin-top:4px;color:#ff7ae8;letter-spacing:.15em}
canvas{display:block;width:100%;height:170px;margin-top:8px;border-radius:6px;background:#01010a}
.sk{padding:0 12px}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:5px;background:#1a1a3a;outline:0;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ff00cc,0 0 18px #00e5ff;cursor:pointer}
.ctl{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px 10px}
button{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font:inherit;cursor:pointer;color:#0ff;background:#12122e;border:1px solid #2f2f6a;border-radius:6px;padding:9px 13px;font-size:1rem;transition:.15s}
button:hover{box-shadow:0 0 12px #00e5ff;border-color:#00e5ff}
button.on{color:#fff;background:#ff00cc55;border-color:#ff00cc;box-shadow:0 0 14px #ff00cc}
button.pl{color:#fff;background:linear-gradient(135deg,#ff00cc,#7a00ff);border:0;box-shadow:0 0 16px #ff00cc;padding:11px 18px}
.vol{display:flex;align-items:center;gap:8px;padding:0 14px 8px;font-size:.7rem;color:#ff7ae8}
.vol input{flex:1;margin:0}
.pls{max-height:230px;overflow:auto;margin:0 12px 12px;border-radius:8px;background:#02020a;border:1px solid #2b2b5a}
.it{display:flex;gap:10px;padding:8px 12px;font-size:.82rem;cursor:pointer;border-bottom:1px solid #12122a}
.it:hover{background:#1a1a3a}
.it.act{color:#fff;background:linear-gradient(90deg,#ff00cc44,#00e5ff22);text-shadow:0 0 8px #0ff}
.it b{color:#ffe600;width:1.8em;font-weight:normal}
@media (prefers-reduced-motion:reduce){.amp,.title span{animation:none!important}}
@media (max-width:480px){.amp{margin:8px}.time{font-size:1.6rem;min-width:84px}canvas{height:140px}.ctl{gap:6px}button{padding:8px 10px}}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pls::-webkit-scrollbar{width:8px}.pls::-webkit-scrollbar-thumb{background:linear-gradient(#ff00cc,#00e5ff);border-radius:4px}
</style></head><body>
<div class="amp"><div class="in">
 <div class="bar"><span>◆ NEON AMP ◆</span><span id="st">STOP</span></div>
 <div class="disp">
  <div class="row"><div class="time" id="time">00:00</div><div class="title"><span id="title">PILIH LAGU UNTUK MEMULAI</span></div></div>
  <div class="meta" id="meta">192 KBPS · STEREO · WEB AUDIO</div>
  <canvas id="cv" width="1000" height="340"></canvas>
 </div>
 <div class="sk"><input type="range" id="seek" min="0" max="100" step="0.1" value="0"></div>
 <div class="ctl">
  <button id="shuf" title="Acak" aria-label="Acak"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 3h5v5l-2-2-4.5 4.5-1.4-1.4L17.6 4.6zM3 7h4.6l9 10H21v2h-5.4l-9-10H3zm11 8.1 1.4-1.4 3.2 3.2 2-2V21h-5l2-2z"/></svg></button><button id="prev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
  <button class="pl" id="play" aria-label="Putar atau jeda"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
  <button id="next" aria-label="Berikutnya"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button><button id="rep" title="Ulang" aria-label="Ulang"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  <button id="mode" title="Ganti gaya visual" aria-label="Ganti gaya visual"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M4 14h3v6H4zm5-8h3v14H9zm5 5h3v9h-3zm5-7h3v16h-3z"/></svg></button>
 </div>
 <div class="vol">VOL<input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></div>
 <div class="pls" id="list"></div>
</div></div>
<audio id="a" preload="metadata" crossorigin="anonymous"></audio>
<script>
fetch('songs.json').then(r=>r.json()).then(S=>{
const $=i=>document.getElementById(i),a=$('a'),cv=$('cv'),g=cv.getContext('2d');
const PLAY_I=`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`,PAUSE_I=`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
let i=-1,shuf=false,rep=false,ctx,an,data,mode=0,started=false;
const fmt=s=>isFinite(s)?String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'):'00:00';
S.forEach((n,k)=>{const d=document.createElement('div');d.className='it';d.innerHTML='<b>'+String(k+1).padStart(2,'0')+'</b>'+n;d.onclick=()=>load(k,true);$('list').appendChild(d)});
function initAudio(){
 if(started)return;started=true;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.82;
 const src=ctx.createMediaElementSource(a);src.connect(an);an.connect(ctx.destination);
 data=new Uint8Array(an.frequencyBinCount);
}
function load(k,p){i=k;a.src='songs/'+encodeURIComponent(S[k])+'.mp3';
 $('title').textContent=(k+1)+'. '+S[k].toUpperCase()+'  ◆  ';
 [...$('list').children].forEach((e,x)=>e.classList.toggle('act',x==k));
 if(p){initAudio();ctx.resume();a.play()}}
function nxt(d){if(!S.length)return;load(shuf?Math.floor(Math.random()*S.length):(i+d+S.length)%S.length,true)}
$('play').onclick=()=>{initAudio();ctx.resume();if(i<0)load(0,true);else a.paused?a.play():a.pause()};
$('next').onclick=()=>nxt(1);$('prev').onclick=()=>nxt(-1);
$('shuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};
$('rep').onclick=e=>{rep=!rep;e.currentTarget.classList.toggle('on',rep)};
$('mode').onclick=()=>{mode=(mode+1)%3};
a.onplay=()=>{$('play').innerHTML=PAUSE_I;$('st').textContent='PLAY'};
a.onpause=()=>{$('play').innerHTML=PLAY_I;$('st').textContent='PAUSE'};
a.onended=()=>rep?(a.currentTime=0,a.play()):nxt(1);
a.ontimeupdate=()=>{$('seek').value=a.duration?a.currentTime/a.duration*100:0;$('time').textContent=fmt(a.currentTime)};
$('seek').oninput=e=>{if(a.duration)a.currentTime=e.target.value/100*a.duration};
$('vol').oninput=e=>a.volume=e.target.value;a.volume=.9;

const N=48,peaks=new Array(N).fill(0),vel=new Array(N).fill(0);let hue=0,bass=0;
function bands(){
 const out=new Array(N).fill(0);if(!an)return out;an.getByteFrequencyData(data);
 const max=Math.floor(data.length*0.62);
 for(let b=0;b<N;b++){
  const lo=Math.floor(Math.pow(b/N,2.0)*max)+1,hi=Math.max(lo+1,Math.floor(Math.pow((b+1)/N,2.0)*max)+1);
  let s=0;for(let k=lo;k<hi;k++)s+=data[k];out[b]=(s/(hi-lo))/255;
 }return out;
}
function draw(){
 requestAnimationFrame(draw);if(document.hidden)return;
 const W=cv.width,H=cv.height;hue=(hue+.6)%360;
 g.globalCompositeOperation='source-over';g.fillStyle='rgba(1,1,10,.28)';g.fillRect(0,0,W,H);
 const v=bands();
 bass=bass*.8+(v.slice(0,5).reduce((x,y)=>x+y,0)/5)*.2;
 // grid
 g.strokeStyle='rgba(120,80,255,.07)';g.lineWidth=1;
 for(let y=0;y<H;y+=34){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 g.globalCompositeOperation='lighter';
 const bw=W/N;
 if(mode<2){
  for(let b=0;b<N;b++){
   const h=Math.max(4,Math.pow(v[b],1.15)*H*.92);
   if(h>peaks[b]){peaks[b]=h;vel[b]=0}else{vel[b]+=.35;peaks[b]=Math.max(0,peaks[b]-vel[b])}
   const x=b*bw+bw*.14,w=bw*.72,col=(hue+b*(360/N)*1.2)%360;
   const gr=g.createLinearGradient(0,H,0,H-h);
   gr.addColorStop(0,`hsl(${col},100%,50%)`);gr.addColorStop(.6,`hsl(${(col+60)%360},100%,60%)`);gr.addColorStop(1,`hsl(${(col+120)%360},100%,75%)`);
   g.shadowColor=`hsl(${col},100%,60%)`;g.shadowBlur=18;g.fillStyle=gr;
   if(mode==0){ // segmented
    const seg=9,sh=H/38;
    for(let y=H-sh;y>H-h;y-=sh*1.35){g.fillRect(x,y,w,sh)}
   }else{g.fillRect(x,H-h,w,h)}
   g.shadowBlur=14;g.fillStyle='#fff';g.fillRect(x,H-peaks[b]-5,w,4);
   // reflection
   g.globalAlpha=.12;g.shadowBlur=0;g.fillStyle=`hsl(${col},100%,60%)`;g.fillRect(x,H-h*.0,w,0);g.globalAlpha=1;
  }
 }else{ // radial / mirrored wave
  const cx=W/2,cy=H/2,r0=34+bass*40;
  for(let b=0;b<N;b++){
   const ang=b/N*Math.PI*2-Math.PI/2,h=8+v[b]*H*.42,col=(hue+b*7)%360;
   g.strokeStyle=`hsl(${col},100%,60%)`;g.shadowColor=g.strokeStyle;g.shadowBlur=16;g.lineWidth=bw*.5;g.lineCap='round';
   g.beginPath();g.moveTo(cx+Math.cos(ang)*r0*1.6,cy+Math.sin(ang)*r0);g.lineTo(cx+Math.cos(ang)*(r0+h)*1.6,cy+Math.sin(ang)*(r0+h*.9));g.stroke();
  }
 }
 g.shadowBlur=0;
 // bass pulse glow
 const pg=g.createRadialGradient(W/2,H,0,W/2,H,W*.6);
 pg.addColorStop(0,`hsla(${hue},100%,55%,${bass*.35})`);pg.addColorStop(1,'transparent');
 g.fillStyle=pg;g.fillRect(0,0,W,H);
 // oscilloscope line
 if(an){const td=new Uint8Array(an.fftSize);an.getByteTimeDomainData(td);
  g.strokeStyle=`hsl(${(hue+180)%360},100%,70%)`;g.lineWidth=2;g.shadowColor=g.strokeStyle;g.shadowBlur=10;g.beginPath();
  for(let x=0;x<W;x+=4){const s=td[Math.floor(x/W*td.length)]/255;const y=H*.5+(s-.5)*H*.35;x?g.lineTo(x,y):g.moveTo(x,y)}
  g.globalAlpha=.55;g.stroke();g.globalAlpha=1;g.shadowBlur=0}
}
draw();
});
</script></body></html>
